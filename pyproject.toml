[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-tcp-wrapper-country-filter"
dynamic = ["version"]
description = "TCP Wrapper filter that allows or denies a connection by country."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.13"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["tcp-wrapper", "security", "country", "filter", "cli"]

dependencies = [
  "maxminddb>=2.6",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lupaxa-security-toolbox/tcp-wrapper-country-filter"
Repository = "https://github.com/lupaxa-security-toolbox/tcp-wrapper-country-filter"
Issues = "https://github.com/lupaxa-security-toolbox/tcp-wrapper-country-filter/issues"

[project.scripts]
country-filter = "country_filter:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "hatch>=1.12.0",
  "bump-my-version>=1.2.0",
  "pip-audit>=2.7.0",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.version]
path = "src/country-filter.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/country-filter.py",
  "src/country_filter.py",
  "README.md",
  "LICENCE",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/country_filter.py"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/country_filter.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4", "ISC", "D", "ANN", "PT"]
ignore = [
  "D200", "D201", "D202", "D203", "D204", "D205", "D206", "D207", "D208", "D209", "D210", "D211", "D212",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "D", "ANN001", "ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["country_filter"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
files = ["src/country-filter.py", "tests"]
exclude = ["src/country_filter.py"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings --cov=country_filter --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["country_filter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
